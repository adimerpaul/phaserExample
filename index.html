<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /*body {*/
        /*    background: #0d1b2a;*/
        /*    display: flex;*/
        /*    justify-content: center;*/
        /*    align-items: center;*/
        /*    height: 100vh;*/
        /*}*/
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 500,
        height: 380,
        backgroundColor: '#0d1b2a',
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 500 }, // gravedad hacia abajo
                debug: false          // ponlo en true para ver los hitboxes
            }
        },
        scene: { preload, create, update }
    };

    new Phaser.Game(config);

    let jugador, plataformas, cursors;

    function preload() {
        // No tenemos imágenes, generamos texturas con código
        const g = this.make.graphics({ add: false });

        // Textura del jugador (cuadro azul 32x32)
        g.fillStyle(0x00d4ff);
        g.fillRect(0, 0, 32, 32);
        g.generateTexture('jugador', 32, 32);

        // Textura de plataforma (rectángulo verde)
        g.clear();
        g.fillStyle(0x4ade80);
        g.fillRect(0, 0, 200, 16);
        g.generateTexture('plataforma', 200, 16);

        g.destroy();
    }

    function create() {
        // ── Plataformas estáticas (no las afecta la gravedad) ──
        plataformas = this.physics.add.staticGroup();
        // Suelo largo
        plataformas.create(250, 370, 'plataforma').setScale(2.5, 1).refreshBody();
        // Plataformas flotantes
        plataformas.create(100, 270, 'plataforma');
        plataformas.create(360, 200, 'plataforma');
        plataformas.create(200, 130, 'plataforma').setScale(0.8, 1).refreshBody();

        // ── Jugador con física ──
        jugador = this.physics.add.sprite(80, 300, 'jugador');
        jugador.setBounce(0.05);           // pequeño rebote al caer
        jugador.setCollideWorldBounds(true); // no salir del canvas

        // ── Colisión jugador ↔ plataformas ──
        this.physics.add.collider(jugador, plataformas);

        cursors = this.input.keyboard.createCursorKeys();

        this.add.text(10, 10, '← → para moverse  ·  ↑ para saltar', {
            fontSize: '13px', color: '#888'
        });
    }

    function update() {
        // Movimiento horizontal
        if (cursors.left.isDown) {
            jugador.setVelocityX(-200);
        } else if (cursors.right.isDown) {
            jugador.setVelocityX(200);
        } else {
            jugador.setVelocityX(0); // frenar si no hay tecla
        }

        // Saltar — solo si está tocando el suelo
        if (cursors.up.isDown && jugador.body.touching.down) {
            jugador.setVelocityY(-420);
        }
    }
</script>
</body>
</html>
